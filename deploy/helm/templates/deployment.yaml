apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}{{ if .Values.image.tag }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secrets
                  key: api_key
            - name: OPENROUTER_MODEL
              value: {{ .Values.env.openrouter_model | quote }}
            - name: OPENROUTER_APP_TITLE
              value: {{ .Values.env.openrouter_app_title | quote }}
            - name: CI_BRIDGE_REPO
              value: {{ .Values.env.ci_bridge_repo | quote }}
            - name: CI_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secrets
                  key: ci_bridge_token
            - name: SUBJECT_REPO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secrets
                  key: subject_repo_token
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: challenge-app-secrets
                  key: huggingface_token
                  optional: true
            {{- with .Values.env.hf_embedding_model }}
            - name: HF_EMBEDDING_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if hasKey .Values.env "allow_self_merge" }}
            - name: VERDICT_ALLOW_SELF_MERGE
              value: {{ .Values.env.allow_self_merge | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.containerPort }}
