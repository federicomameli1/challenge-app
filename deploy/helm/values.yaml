name: verdict
namespace: verdict
deploymentName: verdict
serviceName: verdict

replicaCount: 1

image:
  repository: ghcr.io/federicomameli1/verdict
  pullPolicy: IfNotPresent

containerPort: 80

service:
  type: NodePort
  port: 80
  targetPort: 80
  # Leave unset to let Kubernetes auto-assign a NodePort.
  # nodePort: 30080

env:
  openrouter_model: "z-ai/glm-4.5-air:free"
  openrouter_app_title: "Verdict"
  ci_bridge_repo: "federicomameli1/challenge-app"
