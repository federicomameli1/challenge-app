name: verdict
namespace: verdict
deploymentName: verdict
serviceName: verdict

replicaCount: 1

image:
  repository: ghcr.io/federicomameli1/verdict
  pullPolicy: IfNotPresent

containerPort: 80

service:
  type: NodePort
  port: 80
  targetPort: 80
  # Leave unset to let Kubernetes auto-assign a NodePort.
  # nodePort: 30080

env:
  openrouter_model: "z-ai/glm-4.5-air:free"
  openrouter_app_title: "Verdict"
  ci_bridge_repo: "federicomameli1/challenge-app"
  # HuggingFace embedding model for RAG. Leave unset to use the runner's
  # default (sentence-transformers/all-MiniLM-L6-v2). The token itself
  # is read from the 'huggingface_token' key in the challenge-app-secrets
  # secret (optional — endpoint returns 503 if missing).
  hf_embedding_model: ""
  # DEMO AFFORDANCE — remove before going to production.
  # When "true", the backend silently skips the GitHub APPROVE call when
  # the PAT owner is also the PR author (GitHub returns 422 in that case)
  # and proceeds straight to merge. Set to "false" in prod so a real
  # reviewer is always required. Default in code is true.
  allow_self_merge: "true"
