name: verdict
namespace: verdict
deploymentName: verdict
serviceName: verdict

replicaCount: 1

image:
  repository: ghcr.io/federicomameli1/verdict
  pullPolicy: IfNotPresent

containerPort: 80

service:
  type: NodePort
  port: 80
  targetPort: 80
  # Leave unset to let Kubernetes auto-assign a NodePort.
  # nodePort: 30080

env:
  openrouter_model: "google/gemma-4-31b-it:free"
  openrouter_app_title: "Verdict"
  ci_bridge_repo: "federicomameli1/wayside-monitor"
  # HuggingFace embedding model for RAG. Leave unset to use the runner's
  # default (sentence-transformers/all-MiniLM-L6-v2). The token itself
  # is read from the 'huggingface_token' key in the verdict-secrets
  # secret (optional — endpoint returns 503 if missing).
  hf_embedding_model: ""
  allow_self_merge: "true"
  # Seconds between K8s-native ArgoCD app polls. Set to "0" to disable
  # and rely purely on ArgoCD notifications webhooks.
  argocd_poll_interval: "30"
